# Azure spoke topology for confidential containers (multi-cluster).
# Runs sandboxed containers operator and confidential workloads.
# Paired with trusted-hub topology — spoke is imported into ACM from the hub.
# Set main.clusterGroupName: azure-spoke in values-global.yaml on the spoke cluster.

clusterGroup:
  name: azure-spoke
  isHubCluster: false
  # Map form (deep-mergeable — see values-baremetal.yaml).
  namespaces:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    external-secrets:
    openshift-sandboxed-containers-operator:
    hello-openshift:
    kbs-access:
    cert-manager-operator:
  subscriptions:
    # ACM is kept anticipating
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    sandbox:
      name: sandboxed-containers-operator
      namespace: openshift-sandboxed-containers-operator
      channel: stable
      installPlanApproval: Manual
      csv: sandboxed-containers-operator.v1.13.1
      annotations:
        argocd.argoproj.io/sync-wave: "10"
    cert-manager:
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      channel: stable-v1
      annotations:
        argocd.argoproj.io/sync-wave: "10"

  projects:
  - hub
  - vault
  - trustee
  - external-secrets
  - sandbox
  - workloads
  - default
  # Explicitly mention the cluster-state based overrides we plan to use for this pattern.
  # We can use self-referential variables because the chart calls the tpl function with these variables defined
  sharedValueFiles:
  - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'
  - '/overrides/values-{{ $.Values.global.clusterVersion }}.yaml'

  # No CRB wave knob here: the cluster-admin CRB is pre-created by the ACM policy
  # on managed spokes, and upstream reverted the -1 default for spokes after
  # observed gitops races (clustergroup commit 61a99b4).

  applications:

    secrets-operator:
      name: openshift-external-secrets
      namespace: external-secrets
      project: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
      annotations:
        argocd.argoproj.io/sync-wave: "0"

    sandbox:
      name: sandbox
      namespace: openshift-sandboxed-containers-operator
      project: sandbox
      chart: sandboxed-containers
      chartVersion: 0.2.*
      annotations:
        argocd.argoproj.io/sync-wave: "10"
      overrides:
        - name: global.secretStore.backend
          value: vault
        - name: secretStore.name
          value: vault-backend
        - name: secretStore.kind
          value: ClusterSecretStore
  
    hello-openshift:
      name: hello-openshift
      namespace: hello-openshift
      project: workloads
      path: charts/coco-supported/hello-openshift
      annotations:
        argocd.argoproj.io/sync-wave: "30"

    kbs-access-curl:
      name: kbs-access-curl
      namespace: kbs-access
      project: workloads
      path: charts/coco-supported/kbs-access-curl
      annotations:
        argocd.argoproj.io/sync-wave: "30"

    kbs-access-sealed:
      name: kbs-access-sealed
      namespace: kbs-access
      project: workloads
      path: charts/coco-supported/kbs-access-sealed
      annotations:
        argocd.argoproj.io/sync-wave: "30"

  imperative:
    jobs:
    - name: get-azure-deps
      playbook: ansible/get-azure-deps.yaml
      verbosity: -vvv
      timeout: 3600
    - name: configure-azure-nat-gateway
      playbook: ansible/azure-nat-gateway.yaml
      verbosity: -vvv
      timeout: 3600