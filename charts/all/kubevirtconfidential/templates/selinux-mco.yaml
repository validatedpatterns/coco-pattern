{{- if .Values.global.kubevirt.confidential.enabled }}
{{- range list "master" "worker" }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: {{ . }}
  name: 99-kubevirt-qgs-selinux-{{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/selinux/kubevirt-qgs.cil
          mode: 0644
          contents:
            # CIL (Common Intermediate Language) policy — RHCOS native format.
            # pp format not used: RHCOS lacks /usr/libexec/selinux/hll/pp converter.
            # Source: charts/all/kubevirtconfidential/selinux/kubevirt-qgs.te
            # Decoded content:
            #   (typeattributeset cil_gen_require container_t)
            #   (typeattributeset cil_gen_require qgs_var_run_t)
            #   (allow container_t qgs_var_run_t (unix_stream_socket (connectto)))
            #   (allow container_t qgs_var_run_t (sock_file (write)))
            source: data:text/plain;charset=utf-8;base64,KHR5cGVhdHRyaWJ1dGVzZXQgY2lsX2dlbl9yZXF1aXJlIGNvbnRhaW5lcl90KQoodHlwZWF0dHJpYnV0ZXNldCBjaWxfZ2VuX3JlcXVpcmUgcWdzX3Zhcl9ydW5fdCkKKGFsbG93IGNvbnRhaW5lcl90IHFnc192YXJfcnVuX3QgKHVuaXhfc3RyZWFtX3NvY2tldCAoY29ubmVjdHRvKSkpCihhbGxvdyBjb250YWluZXJfdCBxZ3NfdmFyX3J1bl90IChzb2NrX2ZpbGUgKHdyaXRlKSkpCg==
    systemd:
      units:
        - name: kubevirt-qgs-selinux.service
          enabled: true
          contents: |
            [Unit]
            Description=Load kubevirt-qgs SELinux policy module (CIL)
            After=local-fs.target
            ConditionPathExists=/etc/selinux/kubevirt-qgs.cil
            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/sbin/semodule -i /etc/selinux/kubevirt-qgs.cil
            [Install]
            WantedBy=multi-user.target
{{- end }}
{{- end }}
