{{- if .Values.global.kubevirt.confidential.enabled }}
{{- range list "master" "worker" }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: {{ . }}
  name: 99-kubevirt-qgs-selinux-{{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/selinux/kubevirt-qgs.pp
          mode: 0644
          contents:
            # Compiled on node-02 (RHCOS/RHEL9) via oc debug node + checkmodule/semodule_package.
            # Source: charts/all/kubevirtconfidential/selinux/kubevirt-qgs.te
            # To regenerate: oc debug node/<node> -- chroot /host checkmodule -M -m -o /tmp/kubevirt-qgs.mod <te> && semodule_package -o /tmp/kubevirt-qgs.pp -m /tmp/kubevirt-qgs.mod && base64 -w0 /tmp/kubevirt-qgs.pp
            source: data:application/octet-stream;base64,
    systemd:
      units:
        - name: kubevirt-qgs-selinux.service
          enabled: true
          contents: |
            [Unit]
            Description=Load kubevirt-qgs SELinux policy module
            After=local-fs.target
            ConditionPathExists=/etc/selinux/kubevirt-qgs.pp
            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/sbin/semodule -i /etc/selinux/kubevirt-qgs.pp
            [Install]
            WantedBy=multi-user.target
{{- end }}
{{- end }}
