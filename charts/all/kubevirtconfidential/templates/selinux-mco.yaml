{{- if .Values.global.kubevirt.confidential.enabled }}
{{- range list "master" "worker" }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: {{ . }}
  name: 99-kubevirt-qgs-selinux-{{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/selinux/kubevirt-qgs.te
          mode: 0644
          contents:
            # SELinux type enforcement source — compiled on first boot by kubevirt-qgs-selinux.service.
            # checkmodule -C outputs CIL directly; semodule loads CIL natively (no HLL pp converter needed).
            # Source: charts/all/kubevirtconfidential/selinux/kubevirt-qgs.te
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: kubevirt-qgs-selinux.service
          enabled: true
          contents: |
            [Unit]
            Description=Compile and load kubevirt-qgs SELinux policy module
            After=local-fs.target
            ConditionPathExists=/etc/selinux/kubevirt-qgs.te
            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/bin/checkmodule -M -m -C -o /tmp/kubevirt-qgs.cil /etc/selinux/kubevirt-qgs.te
            ExecStart=/usr/sbin/semodule -i /tmp/kubevirt-qgs.cil
            [Install]
            WantedBy=multi-user.target
{{- end }}
{{- end }}
