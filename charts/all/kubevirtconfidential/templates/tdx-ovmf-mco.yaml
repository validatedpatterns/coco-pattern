{{- if .Values.global.kubevirt.confidential.enabled }}
{{- range list "master" "worker" }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: {{ . }}
  name: 99-kubevirt-tdx-ovmf-{{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/qemu/firmware/61-edk2-ovmf-x64-inteltdx-nosb.json
          mode: 0644
          contents:
            # TDX OVMF firmware descriptor WITHOUT SecureBoot.
            # Required because the only shipped TDX descriptor
            # (60-edk2-ovmf-x64-inteltdx.json) requires SecureBoot,
            # but TDX VMs in KubeVirt cannot use SMM (which SecureBoot needs).
            # This descriptor points to OVMF.inteltdx.fd (non-secboot variant)
            # and allows KubeVirt to find a matching ROM for:
            #   TDX=true, SecureBoot=false, SMM=false
            source: data:text/plain;charset=utf-8;base64,
{{- end }}
{{- end }}
