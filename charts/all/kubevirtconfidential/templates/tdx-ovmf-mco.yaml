{{- if .Values.global.kubevirt.confidential.enabled }}
{{- range list "master" "worker" }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: {{ . }}
  name: 99-kubevirt-tdx-ovmf-{{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/qemu/firmware/61-edk2-ovmf-x64-inteltdx-nosb.json
          mode: 0644
          contents:
            # TDX OVMF firmware descriptor WITHOUT SecureBoot.
            # /usr/share/qemu/firmware/ is read-only on RHCOS (OSTree).
            # A systemd unit (below) overlays this file over /usr/share/qemu/firmware/
            # at boot so virt-handler finds it during firmware selection.
            # Descriptor points to OVMF.inteltdx.fd (non-secboot variant):
            #   TDX=true, SecureBoot=false, SMM=false
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: kubevirt-tdx-ovmf-overlay.service
          enabled: true
          contents: |
            [Unit]
            Description=Overlay TDX no-secboot OVMF descriptor into /usr/share/qemu/firmware
            DefaultDependencies=no
            After=local-fs.target
            Before=kubelet.service
            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/bin/bash -c '\
              mkdir -p /run/qemu-firmware-overlay/upper /run/qemu-firmware-overlay/work && \
              mount -t overlay overlay \
                -o lowerdir=/usr/share/qemu/firmware:/etc/qemu/firmware,upperdir=/run/qemu-firmware-overlay/upper,workdir=/run/qemu-firmware-overlay/work \
                /usr/share/qemu/firmware'
            [Install]
            WantedBy=multi-user.target
{{- end }}
{{- end }}
