---
# The Intel TDX DCAP operator creates QGS pods that require privileged
# access (hostPath volumes, runAsUser 0, privileged init containers).
# The operator CSV does not declare this SCC requirement — upstream bug.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: intel-tdx-dcap-privileged-scc
  annotations:
    argocd.argoproj.io/sync-wave: "20"
subjects:
  - kind: ServiceAccount
    name: intel-tdx-dcap
    namespace: intel-dcap-operator-system
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:privileged
  apiGroup: rbac.authorization.k8s.io
