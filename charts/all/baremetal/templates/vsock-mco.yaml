{{- range list "master" "worker" }}
{{- if $.Values.tdx.enabled }}
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: {{ . }}
  name: 99-enable-coco-{{ . }}
spec:
  kernelArguments:
  - nohibernate
  - kvm_intel.tdx=1

  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/kata-containers/kata-tdx/config.d/96-kata-kernel-config
          mode: 0644
          contents:
            source: data:text/plain;charset=utf-8;base64,W2h5cGVydmlzb3IucWVtdV0KdGR4X3F1b3RlX2dlbmVyYXRpb25fc2VydmljZV9zb2NrZXRfcG9ydD0wCg==
{{- end }}
{{- end }}
