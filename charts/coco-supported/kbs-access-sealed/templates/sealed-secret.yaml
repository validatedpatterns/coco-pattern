# NOTE: This is a placeholder Kubernetes Secret that contains a KBS resource pointer.
#
# In production, this secret should be created using coco-tools to generate the
# sealed secret resource identifier that points to the actual secret stored in KBS.
#
# The KBS resource pointer format is typically:
#   kbs://<kbs-host>/<resource-path>
#
# Example workflow:
#   1. Store secret in KBS: coco-tools kbs add-secret <key> <value>
#   2. Generate resource pointer: coco-tools kbs get-pointer <key>
#   3. Update this secret with the pointer (base64 encoded)
#
# For testing purposes, this contains a literal secret value.
# Replace with KBS pointer in production deployments.

apiVersion: v1
kind: Secret
metadata:
  name: kbs-sealed-secret
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app: kbs-access-sealed
type: Opaque
data:
  # TODO: Replace with KBS resource pointer generated via coco-tools
  # Example: secret-key: a2JzOi8va2JzLXNlcnZpY2Uua2JzLXN5c3RlbS9zZWNyZXRzL215LXNlY3JldA==
  secret-key: VGhpcyBpcyBhIHRlc3Qgc2VjcmV0IGZyb20gS0JT
