apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kbs-access-sealed
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app: kbs-access-sealed
spec:
  to:
    kind: Service
    name: kbs-access-sealed
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
