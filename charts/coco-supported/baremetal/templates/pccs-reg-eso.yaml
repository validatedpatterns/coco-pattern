---
apiVersion: "external-secrets.io/v1beta1"
kind: ExternalSecret
metadata:
  name: pccs-registration-eso
  namespace: intel-dcap
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: pccs-registration
    template:
      type: Opaque
      data:
        USER_TOKEN: "{{ `{{ .user_token }}` }}"
        PCCS_URL: "https://pccs-service.intel-dcap.svc.cluster.local:8042"
        SECURE_CERT: false
  data:
    - secretKey: user_token
      remoteRef:
        key: 'secret/data/hub/pccs'
        property: api_key
