apiVersion: batch/v1
kind: Job
metadata:
  name: presync-verify-gpu-workload
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: presync-verifier
    spec:
      serviceAccountName: presync-verifier
      restartPolicy: Never
      containers:
        - name: verify
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              NAMESPACE="{{ .Release.Namespace }}"

              echo "[$(date -Iseconds)] Starting Sync hook verification for $NAMESPACE"


              # Check 1: Kyverno ClusterPolicy inject-coco-initdata is Ready
              echo "[$(date -Iseconds)] Checking inject-coco-initdata ClusterPolicy..."
              if ! kubectl get clusterpolicy inject-coco-initdata &>/dev/null; then
                echo "[$(date -Iseconds)] ERROR: inject-coco-initdata ClusterPolicy not found"
                exit 1
              fi

              READY=$(kubectl get clusterpolicy inject-coco-initdata -o jsonpath='{.status.ready}')
              echo "[$(date -Iseconds)] inject-coco-initdata ready=$READY"
              if [ "$READY" != "true" ]; then
                echo "[$(date -Iseconds)] ERROR: inject-coco-initdata ClusterPolicy not Ready"
                exit 1
              fi
              echo "[$(date -Iseconds)] ✓ inject-coco-initdata ClusterPolicy is Ready"

              # Check 2: Kyverno ClusterPolicy propagate-initdata-to-gpu-workload is Ready
              echo "[$(date -Iseconds)] Checking propagate-initdata-to-gpu-workload ClusterPolicy..."
              if ! kubectl get clusterpolicy propagate-initdata-to-gpu-workload &>/dev/null; then
                echo "[$(date -Iseconds)] ERROR: propagate-initdata-to-gpu-workload ClusterPolicy not found"
                exit 1
              fi

              READY=$(kubectl get clusterpolicy propagate-initdata-to-gpu-workload -o jsonpath='{.status.ready}')
              echo "[$(date -Iseconds)] propagate-initdata-to-gpu-workload ready=$READY"
              if [ "$READY" != "true" ]; then
                echo "[$(date -Iseconds)] ERROR: propagate-initdata-to-gpu-workload ClusterPolicy not Ready"
                exit 1
              fi
              echo "[$(date -Iseconds)] ✓ propagate-initdata-to-gpu-workload ClusterPolicy is Ready"

              # Check 3: initdata ConfigMap exists in target namespace
              echo "[$(date -Iseconds)] Checking initdata ConfigMap in $NAMESPACE..."
              if ! kubectl get configmap -n $NAMESPACE initdata &>/dev/null; then
                echo "[$(date -Iseconds)] ERROR: initdata ConfigMap not found in $NAMESPACE"
                exit 1
              fi
              echo "[$(date -Iseconds)] ✓ initdata ConfigMap exists in $NAMESPACE"

              echo "[$(date -Iseconds)] All PreSync checks passed for $NAMESPACE"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
