apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure
  labels:
    app: secure
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure
  template:
    metadata:
      labels:
        app: secure
      annotations:
        peerpods: "true"
        coco.io/initdata-configmap: initdata
        io.katacontainers.config.runtime.create_container_timeout: "900"
    spec:
      runtimeClassName: {{ include "hello-openshift.runtimeClassName" . }}
      containers:
        - name: hello-openshift
          image: registry.redhat.io/ubi9/httpd-24@sha256:68a91ff691092f455fea682330c499588747231c16516cd4f35aff821e6847f2
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: web-content
              mountPath: /var/www/html
            - name: initdata
              mountPath: /opt/confidential-containers/initdata
              readOnly: true
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: web-content
          configMap:
            name: secure-web-content
        - name: initdata
          configMap:
            name: initdata
            optional: false
