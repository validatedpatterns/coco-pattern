# OCP 5.0 version-specific overlay for the baremetal AND baremetal-hub
# cluster groups — loaded via sharedValueFiles when global.clusterVersion
# is "5.0" (the chain entry in values-baremetal*.yaml). Other groups and
# 4.x versions keep loading the shared overrides/values-<ver>.yaml.
#
# WHY the namespaces list is repeated: the 5.0 DCAP bundle (v0.27.0) is
# OwnNamespace-only, and Helm replaces lists wholesale on merge (the
# clustergroup chart does not tpl namespaces), so the whole list must be
# replaced here. Keep it in sync with values-baremetal.yaml apart from
# the DCAP OperatorGroup — the render gate fails if it drifts.
#
# SCOPE: reaches the ROOT clustergroup render and every child application
# listing this file; does NOT reach the bootstrap operators.

clusterGroup:
  # Full replacement of the values-baremetal.yaml namespaces list (see the
  # header); only the DCAP OperatorGroup entry differs (OwnNamespace).
  namespaces:
  - open-cluster-management
  - vault
  - external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
  - external-secrets
  - openshift-sandboxed-containers-operator
  - trustee-operator-system
  - cert-manager-operator
  - cert-manager
  - hello-openshift
  - kbs-access
  - openshift-cnv
  - openshift-storage
  - openshift-nfd
  - baremetal
  - intel-dcap
  - intel-dcap-operator-system:
      operatorGroup: true
      # v0.27.0 (the 5.0 catalog bundle) supports OwnNamespace only
      targetNamespaces:
      - intel-dcap-operator-system
  - nvidia-gpu-operator
  - gpu-workload
  - kyverno
  - kubevirt-vms

  subscriptions:
    # Channel split from stable-4.22 in the 5.0 catalog
    lvm-operator:
      channel: stable-5.0
    # The alpha channel is removed from the 5.0 catalog; stable is its
    # only channel (CSV v0.27.0). 4.22 keeps alpha — no in-place upgrade
    # from the alpha bundle (see the runbook's DCAP migration notes).
    intel-tdx-dcap:
      channel: stable
