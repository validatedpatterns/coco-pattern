# Shared Kyverno chart overrides loaded via extraValueFiles.
# OpenShift security context compatibility: null all securityContext fields.
# Disable wgpolicyk8s CRDs and reports controller (not needed for coco-pattern).
# Profile-specific overrides (backgroundController.resources) stay inline in values-<profile>.yaml.
global:
  image:
    registry: 172.25.36.135:8443
admissionController:
  container:
    securityContext: null
  initContainer:
    securityContext: null
backgroundController:
  securityContext: null
cleanupController:
  securityContext: null
reportsController:
  securityContext: null
  enabled: false
crds:
  migration:
    securityContext: null
  groups:
    wgpolicyk8s:
      policyreports: false
      clusterpolicyreports: false
webhooksCleanup:
  securityContext: null
test:
  securityContext: null
admissionController:
  image:
    tag: v1.13.4
  initImage:
    tag: v1.13.4
backgroundController:
  image:
    tag: v1.13.4
cleanupController:
  image:
    tag: v1.13.4
reportsController:
  image:
    tag: v1.13.4
crds:
  migration:
    image:
      tag: v1.13.4
webhooksCleanup:
  image:
    tag: v1.13.4
