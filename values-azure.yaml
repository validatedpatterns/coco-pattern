# Azure single-cluster topology for confidential containers.
# Deploys all components (Trustee, Vault, ACM, sandboxed containers, workloads) in one cluster.
# Set main.clusterGroupName: azure in values-global.yaml to use.

global:
  options:
    # Wave -1 for the chart's own cluster-admin CRB — without it the first gated
    # sync deadlocks on wave-0 (patterns-operator#887, closed via this knob).
    clusterRoleBindingSyncWave: "-1"

clusterGroup:
  name: azure
  isHubCluster: true
  # Override health check for Subscriptions to treat UpgradePending as healthy
  # Only applies to pinned CSV subscriptions (sandbox and trustee)
  namespaces:
  - open-cluster-management
  - vault
  - external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
  - external-secrets
  - openshift-sandboxed-containers-operator
  - trustee-operator-system
  - hello-openshift
  - cert-manager-operator
  - cert-manager
  - kbs-access
  - encrypted-storage
  - kyverno
  subscriptions:
    # ACM is kept anticipating
    acm:
      name: advanced-cluster-management
      namespace: open-cluster-management
      annotations:
        argocd.argoproj.io/sync-wave: "10"
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    sandbox:
      name: sandboxed-containers-operator
      namespace: openshift-sandboxed-containers-operator
      channel: stable
      installPlanApproval: Manual
      csv: sandboxed-containers-operator.v1.13.1
      annotations:
        argocd.argoproj.io/sync-wave: "10"
    trustee:
      name: trustee-operator
      namespace: trustee-operator-system
      channel: stable
      installPlanApproval: Manual
      csv: trustee-operator.v1.2.1
      annotations:
        argocd.argoproj.io/sync-wave: "10"
    cert-manager:
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      channel: stable-v1
      annotations:
        argocd.argoproj.io/sync-wave: "10"

  projects:
  - hub
  - vault
  - trustee
  - external-secrets
  - sandbox
  - workloads
  - default
  # Explicitly mention the cluster-state based overrides we plan to use for this pattern.
  # We can use self-referential variables because the chart calls the tpl function with these variables defined
  sharedValueFiles:
  - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'
  - '/overrides/values-{{ $.Values.global.clusterVersion }}.yaml'

  extraObjects:
    wait-for-vault-unsealed:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: wait-for-vault-unsealed
        annotations:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
          argocd.argoproj.io/sync-wave: "5"
      spec:
        backoffLimit: 10
        activeDeadlineSeconds: 1800
        template:
          spec:
            restartPolicy: OnFailure
            containers:
              - name: wait-for-vault
                image: registry.redhat.io/openshift4/ose-cli:latest
                command:
                  - /bin/bash
                  - -c
                  - |
                    echo "Waiting for vault to be unsealed..."
                    while true; do
                      if curl -sk https://vault.vault.svc:8200/v1/sys/seal-status | grep -q '"sealed":false'; then
                        echo "Vault unsealed. Waiting 120s for secrets to load..."
                        sleep 120
                        echo "Done. Proceeding."
                        exit 0
                      fi
                      echo "Vault not ready. Retrying in 15s..."
                      sleep 15
                    done

  applications:
    acm:
      name: acm
      namespace: open-cluster-management
      project: hub
      chart: acm
      chartVersion: 0.1.*
      # Wave 15: after the wave-10 ACM operator subscription (MCH CRD),
      # before trustee at 20.
      annotations:
        argocd.argoproj.io/sync-wave: "15"
      # MCE subscription (created at runtime by MCH from this value) must be
      # born on the right catalog — full rationale: the acm comment in
      # values-baremetal.yaml.
      overrides:
        - name: acm.mce_operator.source
          # Catalog tag derives from global.clusterVersion (4.22 → v4-22,
          # 5.0 → v5-0) — matches the oc-mirror CatalogSource naming.
          value: '{{ if $.Values.global.airgap }}cs-redhat-operator-index-v{{ $.Values.global.clusterVersion | replace "." "-" }}{{ else }}redhat-operators{{ end }}'

    vault:
      name: vault
      namespace: vault
      project: vault
      chart: hashicorp-vault
      # Exact pin: chart 0.1.11 deploys vault:2.1.2-ubi — the version the
      # imageset mirrors. A range (~0.1.10) would resolve to whatever is
      # newest at deploy time and desync from the mirrored vault image
      # (0.1.10 deploys 1.21.4-ubi).
      chartVersion: 0.1.11
      annotations:
        argocd.argoproj.io/sync-wave: "0"

    secrets-operator:
      name: openshift-external-secrets
      namespace: external-secrets
      project: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    trustee:
      name: trustee
      namespace: trustee-operator-system
      project: trustee
      chart: trustee
      chartVersion: 0.10.*
      annotations:
        argocd.argoproj.io/sync-wave: "20"
      extraValueFiles:
        - '/overrides/values-trustee.yaml'
        - '/overrides/values-trustee-azure.yaml'
      overrides:
        - name: global.coco.secured
          value: "true"
    sandbox:
      name: sandbox
      namespace: openshift-sandboxed-containers-operator
      project: sandbox
      chart: sandboxed-containers
      chartVersion: 0.2.*
      annotations:
        argocd.argoproj.io/sync-wave: "10"
    sandbox-policies:
      name: sandbox-policies
      namespace: openshift-sandboxed-containers-operator
      project: sandbox
      chart: sandboxed-policies
      chartVersion: 0.3.*
      annotations:
        argocd.argoproj.io/sync-wave: "20"
      overrides:
        - name: global.coco.azure.tags
          value: "key1=value1,key2=value2"
        - name: global.coco.azure.rootVolumeSize
          value: "20"
    hello-openshift:
      name: hello-openshift
      namespace: hello-openshift
      project: workloads
      path: charts/coco-supported/hello-openshift
      annotations:
        argocd.argoproj.io/sync-wave: "30"
      syncPolicy:
        automated:
          prune: true

    kbs-access-curl:
      name: kbs-access-curl
      namespace: kbs-access
      project: workloads
      path: charts/coco-supported/kbs-access-curl
      annotations:
        argocd.argoproj.io/sync-wave: "30"
      syncPolicy:
        automated:
          prune: true

    kbs-access-sealed:
      name: kbs-access-sealed
      namespace: kbs-access
      project: workloads
      path: charts/coco-supported/kbs-access-sealed
      annotations:
        argocd.argoproj.io/sync-wave: "30"
      syncPolicy:
        automated:
          prune: true

    kyverno:
      name: kyverno
      namespace: kyverno
      project: hub
      path: charts/vendor/kyverno
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      syncPolicy:
        automated: {}
        retry:
          limit: 20
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: deletingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: generatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: imagevalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: mutatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespaceddeletingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedgeneratingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedimagevalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedmutatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedvalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: policyexceptions.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: validatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
      extraValueFiles:
        - '/overrides/values-kyverno.yaml'

    coco-kyverno-policies:
      name: coco-kyverno-policies
      namespace: openshift-sandboxed-containers-operator
      project: sandbox
      path: charts/all/coco-kyverno-policies
      annotations:
        argocd.argoproj.io/sync-wave: "20"

  imperative:
    # NOTE: We *must* use lists and not hashes. As hashes lose ordering once parsed by helm
    # The default schedule is every 10 minutes: imperative.schedule
    # Total timeout of all jobs is 1h: imperative.activeDeadlineSeconds
    # imagePullPolicy is set to always: imperative.imagePullPolicy
    # For additional overrides that apply to the jobs, please refer to
    # https://validatedpatterns.io/imperative-actions/#additional-job-customizations
    jobs:
    - name: get-azure-deps
      playbook: ansible/get-azure-deps.yaml
      verbosity: -vvv
      timeout: 3600
    - name: configure-azure-dns
      playbook: ansible/configure-issuer.yaml
      verbosity: -vvv
      timeout: 3600
    - name: configure-azure-nat-gateway
      playbook: ansible/azure-nat-gateway.yaml
      verbosity: -vvv
      timeout: 3600
    - name: init-data-gzipper
      playbook: ansible/init-data-gzipper.yaml
      verbosity: -vvv
      timeout: 3600
