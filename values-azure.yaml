# Azure single-cluster topology for confidential containers.
# Deploys all components (Trustee, Vault, ACM, sandboxed containers, workloads) in one cluster.
# Set main.clusterGroupName: azure in values-global.yaml to use.

clusterGroup:
  name: azure
  isHubCluster: true
  # Override health check for Subscriptions to treat UpgradePending as healthy
  # Only applies to pinned CSV subscriptions (sandbox and trustee)
  namespaces:
  - open-cluster-management
  - vault
  - external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
  - external-secrets
  - openshift-sandboxed-containers-operator
  - trustee-operator-system
  - hello-openshift
  - cert-manager-operator
  - cert-manager
  - kbs-access
  - encrypted-storage
  - kyverno
  subscriptions:
    # ACM is kept anticipating
    acm:
      name: advanced-cluster-management
      namespace: open-cluster-management
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    sandbox:
      name: sandboxed-containers-operator
      namespace: openshift-sandboxed-containers-operator
      channel: stable
      installPlanApproval: Manual
      csv: sandboxed-containers-operator.v1.12.0
    trustee:
      name: trustee-operator
      namespace: trustee-operator-system
      channel: stable
      installPlanApproval: Manual
      csv: trustee-operator.v1.1.0
    cert-manager:
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      channel: stable-v1

  projects:
  - hub
  - vault
  - trustee
  - external-secrets
  - sandbox
  - workloads
  - default
  # Explicitly mention the cluster-state based overrides we plan to use for this pattern.
  # We can use self-referential variables because the chart calls the tpl function with these variables defined
  sharedValueFiles:
  - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'
  - '/overrides/values-{{ $.Values.global.clusterVersion }}.yaml'
  applications:
    acm:
      name: acm
      namespace: open-cluster-management
      project: hub
      chart: acm
      chartVersion: 0.1.*

    vault:
      name: vault
      namespace: vault
      project: vault
      chart: hashicorp-vault
      chartVersion: 0.1.*

    secrets-operator:
      name: openshift-external-secrets
      namespace: external-secrets
      project: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    trustee:
      name: trustee
      namespace: trustee-operator-system
      project: trustee
      chart: trustee
      chartVersion: 0.8.*
      extraValueFiles:
        - '/overrides/values-trustee.yaml'
      overrides:
        - name: global.coco.secured
          value: "true"
    sandbox:
      name: sandbox
      namespace: openshift-sandboxed-containers-operator
      project: sandbox
      chart: sandboxed-containers
      chartVersion: 0.2.*
    sandbox-policies:
      name: sandbox-policies
      namespace: openshift-sandboxed-containers-operator
      project: sandbox
      chart: sandboxed-policies
      chartVersion: 0.2.*
      overrides:
        - name: global.coco.azure.tags
          value: "key1=value1,key2=value2"
        - name: global.coco.azure.rootVolumeSize
          value: "20"
    hello-openshift:
      name: hello-openshift
      namespace: hello-openshift
      project: workloads
      path: charts/coco-supported/hello-openshift
      syncPolicy:
        automated:
          prune: true

    kbs-access:
      name: kbs-access
      namespace: kbs-access
      project: workloads
      path: charts/coco-supported/kbs-access
      syncPolicy:
        automated:
          prune: true

    kyverno:
      name: kyverno
      namespace: kyverno
      project: hub
      repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      chartVersion: 3.7.*
      syncPolicy:
        automated: {}
        retry:
          limit: 20
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: deletingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: generatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: imagevalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: mutatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespaceddeletingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedgeneratingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedimagevalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedmutatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedvalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: policyexceptions.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: validatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
      extraValueFiles:
        - '/overrides/values-kyverno.yaml'

    coco-kyverno-policies:
      name: coco-kyverno-policies
      namespace: openshift-sandboxed-containers-operator
      project: sandbox
      path: charts/all/coco-kyverno-policies

  imperative:
    # NOTE: We *must* use lists and not hashes. As hashes lose ordering once parsed by helm
    # The default schedule is every 10 minutes: imperative.schedule
    # Total timeout of all jobs is 1h: imperative.activeDeadlineSeconds
    # imagePullPolicy is set to always: imperative.imagePullPolicy
    # For additional overrides that apply to the jobs, please refer to
    # https://validatedpatterns.io/imperative-actions/#additional-job-customizations
    jobs:
    - name: get-azure-deps
      playbook: ansible/get-azure-deps.yaml
      verbosity: -vvv
      timeout: 3600
    - name: configure-azure-dns
      playbook: ansible/configure-issuer.yaml
      verbosity: -vvv
      timeout: 3600
    - name: configure-azure-nat-gateway
      playbook: ansible/azure-nat-gateway.yaml
      verbosity: -vvv
      timeout: 3600
    - name: init-data-gzipper
      playbook: ansible/init-data-gzipper.yaml
      verbosity: -vvv
      timeout: 3600