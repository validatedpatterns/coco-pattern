# Azure single-cluster topology for confidential containers.
# Deploys all components (Trustee, Vault, ACM, sandboxed containers, workloads) in one cluster.
# Set main.clusterGroupName: azure in values-global.yaml to use.

clusterGroup:
  name: azure
  isHubCluster: true
  # Override health check for Subscriptions to treat UpgradePending as healthy
  # Only applies to pinned CSV subscriptions (sandbox and trustee)
  namespaces:
  - open-cluster-management
  - vault
  - external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
  - external-secrets
  - openshift-sandboxed-containers-operator
  - trustee-operator-system
  - hello-openshift
  - cert-manager-operator
  - cert-manager
  - kbs-access
  - encrypted-storage
  - kyverno
  # SAW uses the existing Vault, ESO and sandboxed-containers Operator above.
  - openshell-agents
  - saw-keycloak:
      operatorGroup: true
      targetNamespaces:
        - saw-keycloak
  - rhdh-operator:
      operatorGroup: true
      targetNamespaces: []
  - rhdh
  - saw-portal
  - redhat-ods-operator:
      operatorGroup: true
      targetNamespaces: []
  - openshift-cnv:
      operatorGroup: true
      targetNamespaces:
        - openshift-cnv
  subscriptions:
    # ACM is kept anticipating
    acm:
      name: advanced-cluster-management
      namespace: open-cluster-management
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    sandbox:
      name: sandboxed-containers-operator
      namespace: openshift-sandboxed-containers-operator
      channel: stable
      installPlanApproval: Manual
      csv: sandboxed-containers-operator.v1.13.1
    trustee:
      name: trustee-operator
      namespace: trustee-operator-system
      channel: stable
      installPlanApproval: Manual
      csv: trustee-operator.v1.2.1
    cert-manager:
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      channel: stable-v1
    openshift-virtualization:
      name: kubevirt-hyperconverged
      namespace: openshift-cnv
      channel: stable
    rhbk:
      name: rhbk-operator
      namespace: saw-keycloak
      channel: stable-v26
    rhdh:
      name: rhdh
      namespace: rhdh-operator
      channel: fast
    openshift-pipelines:
      name: openshift-pipelines-operator-rh
      namespace: openshift-operators
      channel: latest
    openshift-ai:
      name: rhods-operator
      namespace: redhat-ods-operator
      channel: fast

  projects:
  - hub
  - vault
  - trustee
  - external-secrets
  - sandbox
  - workloads
  - default
  # Explicitly mention the cluster-state based overrides we plan to use for this pattern.
  # We can use self-referential variables because the chart calls the tpl function with these variables defined
  sharedValueFiles:
  - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'
  - '/overrides/values-{{ $.Values.global.clusterVersion }}.yaml'
  applications:
    acm:
      name: acm
      namespace: open-cluster-management
      project: hub
      chart: acm
      chartVersion: 0.1.*

    vault:
      name: vault
      namespace: vault
      project: vault
      chart: hashicorp-vault
      # Require 0.1.10 or newer within the 0.1.x release series.
      chartVersion: "~0.1.10"

    secrets-operator:
      name: openshift-external-secrets
      namespace: external-secrets
      project: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    trustee:
      name: trustee
      namespace: trustee-operator-system
      project: trustee
      chart: trustee
      chartVersion: 0.10.*
      extraValueFiles:
        - '/overrides/values-trustee.yaml'
        - '/overrides/values-trustee-azure.yaml'
      overrides:
        - name: global.coco.secured
          value: "true"
    sandbox:
      name: sandbox
      namespace: openshift-sandboxed-containers-operator
      project: sandbox
      chart: sandboxed-containers
      chartVersion: 0.2.*
    sandbox-policies:
      name: sandbox-policies
      namespace: openshift-sandboxed-containers-operator
      project: sandbox
      chart: sandboxed-policies
      chartVersion: 0.3.*
      overrides:
        - name: global.coco.azure.tags
          value: "key1=value1,key2=value2"
        - name: global.coco.azure.rootVolumeSize
          value: "20"
    hello-openshift:
      name: hello-openshift
      namespace: hello-openshift
      project: workloads
      path: charts/coco-supported/hello-openshift
      syncPolicy:
        automated:
          prune: true

    kbs-access-curl:
      name: kbs-access-curl
      namespace: kbs-access
      project: workloads
      path: charts/coco-supported/kbs-access-curl
      syncPolicy:
        automated:
          prune: true

    kbs-access-sealed:
      name: kbs-access-sealed
      namespace: kbs-access
      project: workloads
      path: charts/coco-supported/kbs-access-sealed
      syncPolicy:
        automated:
          prune: true

    kyverno:
      name: kyverno
      namespace: kyverno
      project: hub
      path: charts/vendor/kyverno
      syncPolicy:
        automated: {}
        retry:
          limit: 20
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: deletingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: generatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: imagevalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: mutatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespaceddeletingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedgeneratingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedimagevalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedmutatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: namespacedvalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: policyexceptions.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: validatingpolicies.policies.kyverno.io
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
      extraValueFiles:
        - '/overrides/values-kyverno.yaml'

    coco-kyverno-policies:
      name: coco-kyverno-policies
      namespace: openshift-sandboxed-containers-operator
      project: sandbox
      path: charts/all/coco-kyverno-policies

    # SAW applications use the merged SAW source at a fixed revision. Reuse
    # the existing Vault and ESO apps above instead of installing another set.
    openshift-cnv:
      name: openshift-cnv
      namespace: openshift-cnv
      project: workloads
      repoURL: https://github.com/validatedpatterns-sandbox/secure-agent-workspace.git
      targetRevision: f582a1183dc13ee15f8df4349e8467c981a39250
      path: charts/openshift-cnv

    openshell-keycloak:
      name: openshell-keycloak
      namespace: saw-keycloak
      project: workloads
      repoURL: https://github.com/validatedpatterns-sandbox/secure-agent-workspace.git
      targetRevision: f582a1183dc13ee15f8df4349e8467c981a39250
      path: charts/openshell-keycloak
      overrides:
        - name: keycloak.userPasswords.externalSecret.enabled
          value: "true"
        - name: ownerResolver.enabled
          value: "true"

    saw-users:
      name: saw-users
      namespace: openshell-agents
      project: workloads
      repoURL: https://github.com/validatedpatterns-sandbox/secure-agent-workspace.git
      targetRevision: f582a1183dc13ee15f8df4349e8467c981a39250
      path: charts/saw-users
      extraValueFiles:
        - /overrides/saw-users.yaml
      overrides:
        - name: global.repoURL
          value: https://github.com/validatedpatterns-sandbox/secure-agent-workspace.git
        - name: global.targetRevision
          value: f582a1183dc13ee15f8df4349e8467c981a39250
        - name: ownerResolution.enabled
          value: "true"
        - name: global.webSearch.enabled
          value: "true"
          forceString: true
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 20

    openshell-rhdh:
      name: openshell-rhdh
      namespace: rhdh
      project: workloads
      repoURL: https://github.com/validatedpatterns-sandbox/secure-agent-workspace.git
      targetRevision: f582a1183dc13ee15f8df4349e8467c981a39250
      path: charts/openshell-rhdh
      extraValueFiles:
        - /overrides/saw-users.yaml
      overrides:
        - name: global.repoURL
          value: https://github.com/validatedpatterns-sandbox/secure-agent-workspace.git
        - name: global.targetRevision
          value: f582a1183dc13ee15f8df4349e8467c981a39250
        # Kata stays unavailable until the live RuntimeClass has an approved
        # SAW placement and attachable label.
        - name: portal.deploymentModes
          value: '{vm}'

    governance-policy:
      name: governance-policy
      namespace: openshell-agents
      project: workloads
      repoURL: https://github.com/validatedpatterns-sandbox/secure-agent-workspace.git
      targetRevision: f582a1183dc13ee15f8df4349e8467c981a39250
      path: charts/governance-policy

    governance-interceptor:
      name: governance-interceptor
      namespace: openshell-agents
      project: workloads
      repoURL: https://github.com/validatedpatterns-sandbox/secure-agent-workspace.git
      targetRevision: f582a1183dc13ee15f8df4349e8467c981a39250
      path: charts/governance-interceptor
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 20

  imperative:
    # NOTE: We *must* use lists and not hashes. As hashes lose ordering once parsed by helm
    # The default schedule is every 10 minutes: imperative.schedule
    # Total timeout of all jobs is 1h: imperative.activeDeadlineSeconds
    # imagePullPolicy is set to always: imperative.imagePullPolicy
    # For additional overrides that apply to the jobs, please refer to
    # https://validatedpatterns.io/imperative-actions/#additional-job-customizations
    jobs:
    - name: get-azure-deps
      playbook: ansible/get-azure-deps.yaml
      verbosity: -vvv
      timeout: 3600
    - name: configure-azure-dns
      playbook: ansible/configure-issuer.yaml
      verbosity: -vvv
      timeout: 3600
    - name: configure-azure-nat-gateway
      playbook: ansible/azure-nat-gateway.yaml
      verbosity: -vvv
      timeout: 3600
    - name: init-data-gzipper
      playbook: ansible/init-data-gzipper.yaml
      verbosity: -vvv
      timeout: 3600
    - name: saw-portal-vault
      playbook: ansible/playbooks/saw-portal-vault.yaml
      timeout: 300
    - name: saw-ingress-ca
      playbook: ansible/playbooks/saw-ingress-ca.yaml
      timeout: 300
