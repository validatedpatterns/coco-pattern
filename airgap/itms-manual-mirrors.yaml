apiVersion: config.openshift.io/v1
kind: ImageTagMirrorSet
metadata:
  name: itms-manual-mirrors
spec:
  imageTagMirrors:
    # registry.connect.redhat.com is not covered by oc-mirror generated ITMS.
    # Needed for tag-based pulls of certified operator operand images.
    - source: registry.connect.redhat.com/intel
      mirrors:
        - MIRROR_REGISTRY_HOST:8443/intel
    - source: registry.connect.redhat.com/hashicorp
      mirrors:
        - MIRROR_REGISTRY_HOST:8443/hashicorp
    # NOTE: quay.io/community-operator-pipeline-prod removed — oc-mirror 4.22
    # generates ITMS for it in itms-oc-mirror.yaml automatically.
    # Kyverno chart images: the vendored chart defaults to reg.kyverno.io
    # (Kyverno's own registry), which is not mirrored by oc-mirror (the
    # imageset mirrors the content-identical ghcr.io/kyverno/* images).
    # Redirect tag pulls to the mirror's kyverno/* paths.
    - source: reg.kyverno.io
      mirrors:
        - MIRROR_REGISTRY_HOST:8443
