---
# ImageSetConfiguration for CoCo Validated Pattern airgap deployment
# Target: a single mirror registry (org-prefixed target for Quay, e.g.
# quay.example:443/mirror — MIRROR_REGISTRY includes the org path)
# OCP: 5.0.2
# Topology: baremetal (full operator set from values-baremetal.yaml)

# Naming convention: imageset-config-<minor>.yaml (5.0 covers all 5.0.x patches)
# Patch target: 5.0.2 — update minVersion/maxVersion to change patch target

# Usage:
#   oc-mirror -c airgap/imageset-config-5.0.yaml \
#     --workspace file://$HOME/oc-mirror-workspace \
#     docker://<mirror-root-including-org> --v2

apiVersion: mirror.openshift.io/v2alpha1
kind: ImageSetConfiguration
mirror:
  # OCP release — single version pin; update both min/max to change patch
  # 5.0.2 is published only in candidate-5.0 (stable-5.0/fast-5.0 graphs
  # are at 5.0.1). Re-point the channel when 5.0.2 promotes to stable-5.0.
  platform:
    channels:
      - name: candidate-5.0
        minVersion: "5.0.2"
        maxVersion: "5.0.2"
        type: ocp

  # Red Hat operators (from values-baremetal.yaml subscriptions)
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v5.0
      packages:
        # CoCo core
        - name: sandboxed-containers-operator
          channels:
            - name: stable
              minVersion: "1.13.1"
              maxVersion: "1.13.1"
        - name: trustee-operator
          channels:
            - name: stable
              minVersion: "1.2.1"
              maxVersion: "1.2.1"
        # GitOps (ArgoCD) — keep aligned with main.gitops.channel in values-global.yaml
        # defaultChannel override required: the catalog default is "latest"; filtering
        # it out without re-pointing the default fails catalog filtering in oc-mirror v2
        # ("invalid default channel configuration ... a new default channel must be
        # configured for this package").
        - name: openshift-gitops-operator
          defaultChannel: gitops-1.22
          channels:
            - name: gitops-1.22
        # External Secrets
        - name: openshift-external-secrets-operator
          channels:
            - name: stable-v1
        # Cert Manager
        - name: openshift-cert-manager-operator
          channels:
            - name: stable-v1
        # ACM — use default channel (release-5.0 in the 5.0 catalog)
        # filtering to non-default channel causes oc-mirror error
        - name: advanced-cluster-management
        # MCE — required dependency of ACM, must be mirrored explicitly.
        # stable-5.0 is the 5.0 catalog default (stable-2.17 also exists)
        - name: multicluster-engine
          channels:
            - name: stable-5.0
        # Storage (LVM) — channel split from stable-4.22 in the 5.0 catalog
        - name: lvms-operator
          channels:
            - name: stable-5.0
        # CNV (KubeVirt)
        - name: kubevirt-hyperconverged
          channels:
            - name: stable
        # Node Feature Discovery
        - name: nfd
          channels:
            - name: stable

  # Certified operators
    - catalog: registry.redhat.io/redhat/certified-operator-index:v5.0
      packages:
        # GPU operator DISABLED — matches values-baremetal.yaml (the
        # gpu-operator subscription is commented out there: NVIDIA bundle
        # oc-mirror signature issue; nvcr.io copy timeouts). Re-enabling
        # needs its own mirror update and a values change together.

        # Intel device plugins (for TDX/SGX) — certified, NOT redhat catalog
        # Requires registries.d/no-sigstore-certified.yaml (cosign .sig manifests missing)
        - name: intel-device-plugins-operator
          channels:
            - name: stable
        # Intel TDX DCAP operator — QGS lifecycle management.
        # 5.0: the alpha channel is gone from the catalog; stable is now
        # the default and only channel (CSV v0.27.0, OwnNamespace-only,
        # same bundle digest as the 4.22 stable channel)
        - name: intel-tdx-dcap-operator
          channels:
            - name: stable

  # Community operators
    - catalog: registry.redhat.io/redhat/community-operator-index:v5.0
      packages:
        # Use v0.0.80+ — Docker manifest list format (not OCI image index;
        # older tags use an OCI index format Quay rejects). Cluster runs
        # v0.0.83; channel "fast" is the catalog default
        # (main.patternsOperator.channel in values-global.yaml)
        - name: patterns-operator
          channels:
            - name: fast

  # Additional container images (application workloads)
  additionalImages:
    # Workload images — use the exact digest from charts/coco-supported/*/values.yaml
    # oc-mirror with :latest mirrors the current tag which may differ from the chart digest
    - name: registry.redhat.io/ubi9/httpd-24@sha256:68a91ff691092f455fea682330c499588747231c16516cd4f35aff821e6847f2
    - name: registry.redhat.io/ubi9/ubi:latest
    # NFD operand — 5.0 DaemonSets are digest-pinned from the openshift5
    # repo (CSV relatedImage digest, not the 4.22 tag form)
    - name: registry.redhat.io/openshift5/ose-node-feature-discovery-rhel9@sha256:f238dc852b74caca695f2ba8a36a4b16d38e116a3c00936b13e3267647fd1494
    # Vault — Red Hat certified UBI image from registry.connect.redhat.com
    # (hashicorp-vault chart 0.1.11 deploys vault:2.1.2-ubi by default)
    - name: registry.connect.redhat.com/hashicorp/vault:2.1.2-ubi
    # Kyverno (Helm chart, not OLM). The chart's defaultRegistry is
    # reg.kyverno.io, but the image paths are identical under ghcr.io —
    # mirror from ghcr.io and let the manual ITMS (itms-manual-mirrors.yaml)
    # redirect reg.kyverno.io pulls to the mirror.
    - name: ghcr.io/kyverno/kyverno:v1.17.2
    - name: ghcr.io/kyverno/kyvernopre:v1.17.2
    - name: ghcr.io/kyverno/background-controller:v1.17.2
    - name: ghcr.io/kyverno/cleanup-controller:v1.17.2
    - name: ghcr.io/kyverno/reports-controller:v1.17.2
    - name: ghcr.io/kyverno/kyverno-cli:v1.17.2
    # webhooksCleanup pre-delete hook (helm.sh/hook: pre-delete) — without it,
    # deleting the kyverno app hangs on ImagePullBackOff in airgap.
    - name: registry.k8s.io/kubectl:v1.34.3
    # helm test hook image (kyverno/readiness-checker) — cheap insurance.
    - name: ghcr.io/kyverno/readiness-checker:v0.1.0

    # --- VP Helm OCI charts ---
    - name: quay.io/validatedpatterns/clustergroup:0.9.60
    - name: quay.io/validatedpatterns/acm:0.1.27
    # values pin 0.1.11 exactly (chart 0.1.11 deploys vault:2.1.2-ubi)
    - name: quay.io/validatedpatterns/hashicorp-vault:0.1.11
    - name: quay.io/validatedpatterns/openshift-external-secrets:0.0.4
    - name: quay.io/validatedpatterns/trustee:0.10.2
    - name: quay.io/validatedpatterns/sandboxed-containers:0.2.1
    - name: quay.io/validatedpatterns/sandboxed-policies:0.2.0

    # --- VP framework utility images ---
    - name: quay.io/validatedpatterns/utility-container:latest
    - name: quay.io/validatedpatterns/imperative-container:latest
    - name: quay.io/validatedpatterns/imperative-container:v1
    # pattern-ui-catalog deliberately NOT mirrored: non-essential (console-tab
    # catalog content) and its OCI-index-wrapping-Docker-children manifest is
    # rejected by Quay. patterns-operator v0.0.83 does deploy it — the console
    # tab is simply unavailable in airgap.

    # --- UBI minimal (ArgoCD repo-server init container) ---
    - name: registry.redhat.io/ubi9/ubi-minimal:latest

    # --- oc-debug support-tools ---
    - name: registry.redhat.io/rhel9/support-tools:latest

    # --- VP infrastructure images ---
    - name: registry.redhat.io/openshift4/ose-cli:latest

    # --- Intel DCAP chart images ---
    # Requires registries.d/no-sigstore-certified.yaml for intel-sgx-plugin
    # DCAP v0.27.0 moved QGS from osc-tdx-qgs (redhat.io) to the certified
    # intel/intel-tdx-qgs repo; both digests are the CSV relatedImage values
    # the running cluster deploys (not the 4.22 digests)
    - name: registry.connect.redhat.com/intel/intel-tdx-qgs@sha256:d86a48e3668bff87e2e5f6914b1b06b861efeb9bd145abbcce3129cfb7eb972d
    # intel-device-plugins CSV v0.37.1 digest — the operator overrides the
    # chart's stale 4.22 pin on the SgxDevicePlugin CR at runtime
    - name: registry.connect.redhat.com/intel/intel-sgx-plugin@sha256:b9018557fbf207f625bbfc3a070d2bec5d20b855b05c5cec09e8b12c35ad7871

    # --- Workload images ---
    - name: registry.access.redhat.com/ubi9/ubi:latest

    # --- CNV guest images (OPTIONAL — not mirrored) ---
    # ~2 GB each and NOT consumed (enableCommonBootImageImport: false in the
    # HyperConverged CR), and registry.redhat.io REJECTS :latest for
    # virtio-win — a hard mirror error. Re-enable only for VM boot from
    # DataSource, with pinned tags.

    # Note: kubeVirtContainer: true (oc-mirror platform flag) is for RHCOS/Hosted Control Planes only.
    # Do NOT add it to the OCP platform channel for standalone TDX VMs on baremetal —
    # it is not applicable to this topology and would pull unneeded RHCOS artifacts.
