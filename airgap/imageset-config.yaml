---
# ImageSetConfiguration for CoCo Validated Pattern airgap deployment
# Target: 10.0.0.1:8443
# OCP: 4.21.24
# Topology: baremetal (full operator set from values-baremetal.yaml)
#
# SUPERSEDED: use airgap/imageset-config-4.21.yaml (OCP 4.21) or
#             airgap/imageset-config-4.22.yaml (OCP 4.22) instead.
# Naming convention: imageset-config-<minor>.yaml
#
# Usage:
#   # Mirror to mirror (jump host has both internet and quay access):
#   oc-mirror -c airgap/imageset-config-4.22.yaml \
#     --workspace file://$HOME/oc-mirror-workspace \
#     docker://10.0.0.1:8443/ocp-mirror --v2
#
#   # Or mirror to disk first, then disk to mirror:
#   oc-mirror -c airgap/imageset-config.yaml \
#     file://$HOME/oc-mirror-archive --v2
#   oc-mirror -c airgap/imageset-config.yaml \
#     --from file://$HOME/oc-mirror-archive \
#     docker://10.0.0.1:8443/ocp-mirror --v2

apiVersion: mirror.openshift.io/v2alpha1
kind: ImageSetConfiguration
mirror:
  # OCP release — single version
  platform:
    channels:
      - name: fast-4.21
        minVersion: "4.21.24"
        maxVersion: "4.21.24"
        type: ocp

  # Red Hat operators (from values-baremetal.yaml subscriptions)
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.21
      packages:
        # CoCo core
        - name: sandboxed-containers-operator
          channels:
            - name: stable
              minVersion: "1.13.0"
              maxVersion: "1.13.0"
        - name: trustee-operator
          channels:
            - name: stable
              minVersion: "1.2.0"
              maxVersion: "1.2.0"
        # GitOps (ArgoCD)
        - name: openshift-gitops-operator
          channels:
            - name: latest
        # External Secrets
        - name: openshift-external-secrets-operator
          channels:
            - name: stable-v1
        # Cert Manager
        - name: openshift-cert-manager-operator
          channels:
            - name: stable-v1
        # ACM — use default channel (release-2.17 in 4.21 catalog)
        # filtering to non-default channel causes oc-mirror error
        - name: advanced-cluster-management
        # MCE — required dependency of ACM, must be mirrored explicitly
        # ACM creates an MCE subscription; OLM needs the package in the catalog
        - name: multicluster-engine
        # Storage (LVM)
        - name: lvms-operator
          channels:
            - name: stable-4.21
        # CNV (KubeVirt)
        - name: kubevirt-hyperconverged
          channels:
            - name: stable
        # Node Feature Discovery
        - name: nfd
          channels:
            - name: stable

  # Certified operators
    - catalog: registry.redhat.io/redhat/certified-operator-index:v4.21
      packages:
        - name: gpu-operator-certified
          channels:
            - name: v26.3
              minVersion: "26.3.0"
              maxVersion: "26.3.0"
        # Intel device plugins (for TDX/SGX) — certified, NOT redhat catalog
        - name: intel-device-plugins-operator
          channels:
            - name: stable
        # Intel TDX DCAP operator — QGS lifecycle management (D-07)
        - name: intel-tdx-dcap-operator
          channels:
            - name: alpha

  # Community operators (patterns-operator is NOT in redhat-operator-index for 4.21)
    - catalog: registry.redhat.io/redhat/community-operator-index:v4.21
      packages:
        - name: patterns-operator

  # NOTE: Kyverno is deployed via Helm chart (kyverno.github.io/kyverno), NOT via
  # OLM operator from the community catalog. Its images are in additionalImages below.

  # Additional container images (application workloads)
  additionalImages:
    # Workload images from hello-openshift chart
    - name: registry.redhat.io/ubi9/httpd-24:latest
    # Vault — the VP Helm chart uses the Red Hat certified UBI image,
    # NOT the Docker Hub image. Mirror from registry.connect.redhat.com.
    - name: registry.connect.redhat.com/hashicorp/vault:1.21.4-ubi
    # Kyverno (Helm chart, not OLM — images from ghcr.io)
    - name: ghcr.io/kyverno/kyverno:v1.13.4
    - name: ghcr.io/kyverno/kyvernopre:v1.13.4
    - name: ghcr.io/kyverno/background-controller:v1.13.4
    - name: ghcr.io/kyverno/cleanup-controller:v1.13.4
    - name: ghcr.io/kyverno/reports-controller:v1.13.4

    # --- VP Helm OCI charts (additionalImages — oc-mirror v2 handles these) ---
    # Core VP charts (versions are latest matching glob in values-baremetal.yaml)
    - name: quay.io/validatedpatterns/clustergroup:0.9.58
    - name: quay.io/validatedpatterns/acm:0.1.27
    - name: quay.io/validatedpatterns/hashicorp-vault:0.1.8
    - name: quay.io/validatedpatterns/openshift-external-secrets:0.0.4
    # External VP charts (also published to quay.io/validatedpatterns/)
    - name: quay.io/validatedpatterns/trustee:0.9.0
    - name: quay.io/validatedpatterns/sandboxed-containers:0.2.1
    - name: quay.io/validatedpatterns/sandboxed-policies:0.2.0

    # --- Kyverno Helm chart OCI artifact (chartVersion: 3.7.* in values-baremetal) ---
    - name: ghcr.io/kyverno/charts/kyverno:3.7.2

    # --- VP framework utility images ---
    # IMPORTANT: The VP framework uses :v1 tags for imperative-container (not :latest).
    # Mirror BOTH :latest and :v1 to cover all usage paths.
    - name: quay.io/validatedpatterns/utility-container:latest
    - name: quay.io/validatedpatterns/imperative-container:latest
    - name: quay.io/validatedpatterns/imperative-container:v1

    # --- VP patterns-operator UI catalog ---
    # Required by the patterns-operator console plugin (not mirrored by oc-mirror).
    - name: quay.io/validatedpatterns/pattern-ui-catalog:stable-v1

    # --- UBI minimal (ArgoCD repo-server init container) ---
    # ArgoCD init containers pull by :latest tag; IDMS only handles digests.
    # Mirror the tag explicitly so ITMS can redirect.
    - name: registry.redhat.io/ubi9/ubi-minimal:latest

    # --- oc-debug support-tools (D-05: enables oc debug node/ on disconnected) ---
    - name: registry.redhat.io/rhel9/support-tools:latest

    # --- VP infrastructure images ---
    - name: registry.redhat.io/openshift4/ose-cli:latest

    # --- Intel DCAP chart images ---
    # Digest-pinned (exact refs from intel-dcap chart templates).
    # NOTE: osc-pccs-rhel9:latest and osc-tdx-qgs-rhel9:latest tags do not exist
    # on registry.redhat.io — only digest-pinned refs work.
    - name: registry.redhat.io/openshift-sandboxed-containers/osc-pccs@sha256:edf57087220516115512dc6687b96045cbc69472a3d6d381619f66beae032ad6
    - name: registry.redhat.io/openshift-sandboxed-containers/osc-tdx-qgs@sha256:308d66da94d3116cc16530a4a2cd60a995458f331e1cb3487c6ea3fdae60545b
    - name: registry.connect.redhat.com/intel/intel-sgx-plugin@sha256:4ac8769c4f0a82b3ea04cf1532f15e9935c71fe390ff5a9dc3ee57f970a65f0b

    # --- Workload images ---
    - name: registry.access.redhat.com/ubi9/ubi:latest
    - name: registry.access.redhat.com/ubi9/ubi:9.7-1764578509
