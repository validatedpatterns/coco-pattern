- name: Push pull secret to KBS credential secret
  become: false
  connection: local
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
  tasks:
    - name: Read pull-secret from openshift-config namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig | default(omit) }}"
        api_version: v1
        kind: Secret
        name: pull-secret
        namespace: openshift-config
      register: pull_secret_result

    - name: Fail if pull-secret not found
      ansible.builtin.fail:
        msg: "Pull secret 'pull-secret' not found in namespace 'openshift-config'"
      when: pull_secret_result.resources | length == 0

    - name: Extract and decode .dockerconfigjson from pull secret
      ansible.builtin.set_fact:
        decoded_auth_json: "{{ pull_secret_result.resources[0].data['.dockerconfigjson'] | b64decode }}"
      when: pull_secret_result.resources | length > 0

    - name: Create/update credential secret in trustee-operator-system
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: credential
            namespace: trustee-operator-system
          type: Opaque
          data:
            regcred: "{{ decoded_auth_json | b64encode }}"
