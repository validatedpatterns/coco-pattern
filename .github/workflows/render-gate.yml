---
name: Render gate

on: [push, pull_request]

jobs:
  render_gate:
    name: Values-chain render gate (connected + airgap)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Run the render gate
        run: bash scripts/verify/render-gate.sh quay.example:443/mirror
