# This is currently configured as an 'all in one' deployment in one cluster.

clusterGroup:
  name: trusted-hub
  isHubCluster: true
  namespaces:
  - open-cluster-management
  - vault
  - external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
  - external-secrets
  - trustee-operator-system
  - cert-manager-operator
  - openshift-sandboxed-containers-operator
  - cert-manager
  subscriptions:
    # ACM is kept anticipating
    acm:
      name: advanced-cluster-management
      namespace: open-cluster-management
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    trustee:
      name: trustee-operator
      namespace: trustee-operator-system
      source: redhat-operators
      channel: stable
      installPlanApproval: Manual
      csv: trustee-operator.v1.1.0
    cert-manager:
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      channel: stable-v1

  projects:
  - hub
  - vault
  - trustee
  - external-secrets
  - sandbox
  - workloads
  - default
  # Explicitly mention the cluster-state based overrides we plan to use for this pattern.
  # We can use self-referential variables because the chart calls the tpl function with these variables defined
  sharedValueFiles:
  - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'
  - '/overrides/values-{{ $.Values.global.clusterVersion }}.yaml'
  applications:
    acm:
      name: acm
      namespace: open-cluster-management
      project: hub
      chart: acm
      chartVersion: 0.1.*

    vault:
      name: vault
      namespace: vault
      project: vault
      chart: hashicorp-vault
      chartVersion: 0.1.*

    secrets-operator:
      name: openshift-external-secrets
      namespace: external-secrets
      project: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*

    trustee:
      name: trustee
      namespace: trustee-operator-system #upstream config
      project: trustee
      # DEV: git-based chart reference for testing. Revert to chart/chartVersion before upstream PR.
      repoURL: https://github.com/butler54/trustee-chart.git
      targetRevision: dev/phase1-testing
      path: .
      extraValueFiles:
        - '/overrides/values-trustee.yaml'
      overrides:
        - name: global.coco.secured
          value: "true"
    sandbox-policies:
      name: sandbox-policies
      namespace: openshift-sandboxed-containers-operator #upstream config
      # DEV: git-based chart reference for testing. Revert to chart/chartVersion before upstream PR.
      repoURL: https://github.com/butler54/sandboxed-policies-chart.git
      targetRevision: dev/phase1-testing
      path: .
      overrides:
        - name: global.coco.azure.tags
          value: "key1=value1,key2=value2"
        - name: global.coco.azure.rootVolumeSize
          value: "20"



  imperative:
    image: ghcr.io/butler54/imperative-container:latest
    jobs:
    - name: install-deps
      playbook: ansible/install-deps.yaml
      verbosity: -vvv
      timeout: 3600
    - name: configure-azure-dns
      playbook: ansible/configure-issuer.yaml
      verbosity: -vvv
      timeout: 3600
    - name: init-data-gzipper
      playbook: ansible/init-data-gzipper.yaml
      verbosity: -vvv
      timeout: 3600
  managedClusterGroups:
    spoke:
      name: spoke
      acmlabels:
      - name: clusterGroup
        value: spoke
      helmOverrides:
      - name: clusterGroup.isHubCluster
        value: false
